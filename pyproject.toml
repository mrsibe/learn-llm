[project]
name = "learn-llm"
version = "0.1.0"
description = "Handwritten GPT-2 and Llama-style models for learning AI infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "tensorboard>=2.20.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
]

[project.scripts]
train = "learn_llm.train:main"
generate = "learn_llm.generate:main"
benchmark = "learn_llm.benchmark:main"
evaluate = "learn_llm.evaluate:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learn_llm"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
