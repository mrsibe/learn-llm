# FineWeb-Edu sample-10BT 的本地 token 子集，训练预算 409.6M tokens。
model:
  vocab_size: 32768
  block_size: 1024
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.0
  attention_backend: sdpa
train:
  data_dir: data/fineweb-edu
  out_dir: out/gpt2-fineweb-edu
  steps: 25000
  batch_size: 2
  grad_accum: 8
  dtype: auto
  lr: 0.0003
  min_lr: 0.00003
  scheduler: cosine
  warmup_steps: 500
  decay_steps: 25000
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 500
  eval_batches: 50
  eval_seed: 42
  save_every: 500
  seed: 1337
